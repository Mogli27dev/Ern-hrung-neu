<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ernährung">
<title>Ernährung in der Schwangerschaft</title>
<style>
:root{--bg:#faf6f2;--card:#fff;--text:#2b2420;--muted:#7a6f67;--accent:#d9665a;--ok:#4f9a6a;--warn:#e8a33d;--line:#eadfd6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1816;--card:#2a2522;--text:#f1e9e3;--muted:#a69a91;--accent:#ef8174;--ok:#6dc08a;--warn:#f0b65a;--line:#3a332f;color-scheme:dark}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:24px;margin:4px 0}
h2{font-size:18px;margin:0 0 8px}
.sub{color:var(--muted);font-size:14px}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.nav button,.back{background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:8px 14px;font-size:18px}
.back{font-size:15px;margin-bottom:12px}
.banner{background:color-mix(in srgb,var(--warn) 22%,var(--card));border:1px solid var(--warn);border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:15px}
.day{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:16px;padding:14px;margin-bottom:10px;font:inherit}
.day.today{border-color:var(--accent);border-width:2px}
.day .info{flex:1}
.day .name{font-weight:600}
.bar{height:6px;border-radius:3px;background:var(--line);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.chk{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:transparent;color:#fff;font-size:20px;flex:none}
.chk.on{background:var(--ok);border-color:var(--ok)}
.need{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;cursor:pointer}
.need.on{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--card))}
.need .ic{font-size:26px}
.need .body{flex:1}
.need .t{font-weight:600}
.need .why{color:var(--muted);font-size:14px;margin:2px 0 6px}
.amt{font-size:14px;font-weight:600;margin:0 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:13px}
.box{width:28px;height:28px;border-radius:8px;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;color:#fff}
.need.on .box{background:var(--ok);border-color:var(--ok)}
.eval{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:16px}
.eval ul{margin:6px 0 10px;padding-left:20px}
.badge{display:inline-block;border-radius:999px;padding:3px 12px;font-weight:600;color:#fff;margin-bottom:8px}
.note{color:var(--muted);font-size:12px;margin-top:16px;text-align:center}
.fi{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.fi .dot{width:14px;height:14px;border-radius:50%;margin-top:4px;flex:none}
.fi.g .dot{background:var(--ok)}.fi.y .dot{background:var(--warn)}.fi.r .dot{background:var(--accent)}
.fi .t{font-weight:600}
.fi .lb{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.fi .why{font-size:14px;color:var(--muted)}
.fc{background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:6px 12px;font-size:14px;margin:0 6px 8px 0}
.fc.on{background:var(--text);color:var(--bg)}
#fq,#rdate{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:16px;margin-bottom:10px}
</style>
</head>
<body>
<main id="app"></main>
<script>
var NEEDS=[
{id:"folat",ic:"🥬",n:"Folat / Folsäure",why:"Organ- und Nervensystem des Babys",amt:"Ca. 150 g Blattgemüse oder Hülsenfrüchte (gekocht) + 400 µg Folsäure-Tablette",ex:["Spinat","Brokkoli","Grünkohl","Linsen","Orangen"],tip:"Täglich grünes Gemüse und Hülsenfrüchte einplanen; 400 µg Folsäure als Ergänzung."},
{id:"eiweiss",ic:"🥚",n:"Eiweiß",why:"Zellaufbau und Wachstum",amt:"Ca. 45–55 g, z. B. 2 Eier + 150 g Quark oder Joghurt + 100 g Geflügel (oder 150 g Linsen, gekocht)",ex:["Eier (durchgegart)","Joghurt","Quark","Geflügel","Nüsse"],tip:"Zu jeder Hauptmahlzeit eine Eiweißquelle, z. B. Quark zum Frühstück."},
{id:"eisen",ic:"🫘",n:"Eisen",why:"Blutbildung, Sauerstoff, weniger Müdigkeit",amt:"Bedarf ca. 27 mg: 60 g Haferflocken oder Hirse + 150 g Hülsenfrüchte (gekocht) + eine Vitamin-C-Quelle. Eisenwert beim Arzt prüfen lassen.",ex:["Haferflocken","Hirse","Kichererbsen","Vollkorn","Paprika (Vitamin C)"],tip:"Eisenquellen mit Vitamin C kombinieren, z. B. Haferflocken mit Beeren."},
{id:"jod",ic:"🧂",n:"Jod",why:"Schilddrüse und Gehirnentwicklung",amt:"Bedarf ca. 230 µg: jodiertes Salz + 250 ml Milch oder Joghurt + 1–2 Scheiben Käse; Seefisch 1–2× pro Woche",ex:["Jodsalz","Milchprodukte","Seefisch (durchgegart)"],tip:"Jodiertes Speisesalz nutzen und Milchprodukte einbauen; Jodpräparat mit Ärztin klären."},
{id:"omega3",ic:"🐟",n:"Omega-3 / DHA",why:"Gehirn und Augen",amt:"Ca. 200 mg DHA: 1–2× pro Woche 100–150 g Fisch (durchgegart), täglich 1 EL Lein- oder Rapsöl und 1 Handvoll Walnüsse",ex:["Lachs (durchgegart)","Hering","Leinöl","Walnüsse","Chiasamen"],tip:"Ein- bis zweimal pro Woche fetten Fisch, sonst Lein- oder Rapsöl und Walnüsse."},
{id:"calcium",ic:"🥛",n:"Calcium & Vitamin D",why:"Knochen und Zähne",amt:"Bedarf ca. 1000 mg: 3 Portionen, z. B. 250 ml Milch + 150 g Joghurt + 2 Scheiben Käse (ca. 60 g)",ex:["Milch","Joghurt","Hartkäse","Grünes Gemüse","Calciumreiches Wasser"],tip:"Täglich zwei bis drei Portionen Milchprodukte; Vitamin D bitte mit der Ärztin besprechen."},
{id:"obst",ic:"🥕",n:"Obst & Gemüse",why:"Vitamine, Ballaststoffe, Verdauung",amt:"5 Portionen: 3× Gemüse (ca. 400 g) + 2× Obst (ca. 250 g)",ex:["Äpfel","Beeren","Karotten","Tomaten","Salat (gewaschen)"],tip:"Ziel sind fünf Portionen am Tag: drei Gemüse, zwei Obst."},
{id:"wasser",ic:"💧",n:"Trinken",why:"Kreislauf und Fruchtwasser",amt:"1,5–2 Liter, das sind ca. 6–8 Gläser über den Tag verteilt",ex:["Wasser","Kräutertee","Saftschorle","Ingwertee"],tip:"1,5 bis 2 Liter über den Tag verteilen; eine Flasche in Sichtweite hilft."}
];
var TAGE=["Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag","Sonntag"];
var MON=["Jan.","Feb.","März","Apr.","Mai","Juni","Juli","Aug.","Sept.","Okt.","Nov.","Dez."];
var data={};
try{data=JSON.parse(localStorage.getItem("ern-data")||"{}")}catch(e){data={}}
function save(){try{localStorage.setItem("ern-data",JSON.stringify(data))}catch(e){}}
function iso(d){var m=d.getMonth()+1,t=d.getDate();return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(t<10?"0":"")+t}
function parse(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function addDays(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x}
function weekStart(d){return addDays(d,-((d.getDay()+6)%7))}
function fmt(d){return d.getDate()+". "+MON[d.getMonth()]}
function rec(k){return data[k]||(data[k]={n:{},done:false})}
function cnt(k){var r=data[k];if(!r)return 0;return NEEDS.filter(function(x){return r.n[x.id]}).length}
var today=new Date(),todayKey=iso(today);
var ws=weekStart(today),view="week";
var app=document.getElementById("app");

function banner(){
 var out=[],i,d,k;
 for(i=0;i<7;i++){d=addDays(ws,i);k=iso(d);
  if(k<todayKey&&!(data[k]&&data[k].done))out.push(TAGE[i]);}
 var msg="";
 if(out.length)msg="⚠️ Für "+out.join(", ")+" fehlt noch der Haken. Hol nach, was du kannst, oder prüfe, ob die Bedarfe gedeckt waren.";
 var t=data[todayKey],missing=NEEDS.filter(function(x){return !(t&&t.n[x.id])});
 if(iso(ws)===iso(weekStart(today))&&today.getHours()>=17&&missing.length&&!(t&&t.done)){
  msg+=(msg?"<br><br>":"")+"🍽️ Heute fehlen noch: "+missing.map(function(x){return x.n}).join(", ")+". Vielleicht noch ein kleiner Snack oder das Abendessen darauf abstimmen?";}
 return msg?'<div class="banner">'+msg+'</div>':"";
}

function evaluation(){
 var i,elapsed=0,k;
 for(i=0;i<7;i++){if(iso(addDays(ws,i))<=todayKey)elapsed++;}
 if(elapsed===0)return "";
 var over=iso(addDays(ws,6))<todayKey||today.getDay()===0&&iso(addDays(ws,6))===todayKey;
 var total=0,per={};
 NEEDS.forEach(function(x){per[x.id]=0});
 for(i=0;i<elapsed;i++){k=iso(addDays(ws,i));var r=data[k];
  if(r)NEEDS.forEach(function(x){if(r.n[x.id]){per[x.id]++;total++}});}
 var ratio=total/(elapsed*NEEDS.length),label,col,txt;
 if(ratio>=0.8){label="Sehr gut";col="var(--ok)";txt="Deine Ernährung war insgesamt sehr ausgewogen. Weiter so!"}
 else if(ratio>=0.6){label="Gut";col="var(--ok)";txt="Die Woche hat grundlegend gepasst, an ein paar Stellen geht noch etwas."}
 else if(ratio>=0.4){label="Ausbaufähig";col="var(--warn)";txt="Ein Teil der Bedarfe kam zu kurz. Mit kleinen Änderungen kommst du schnell weiter."}
 else{label="Mehr Abwechslung nötig";col="var(--warn)";txt="Viele Bedarfe waren nicht gedeckt. Wenn Übelkeit das Essen erschwert, sind kleine, häufige Mahlzeiten ok. Sprich bei Sorgen mit Ärztin oder Hebamme."}
 var weak=NEEDS.filter(function(x){return per[x.id]/elapsed<0.6});
 var strong=NEEDS.filter(function(x){return per[x.id]/elapsed>=0.8});
 var h='<div class="eval"><h2>'+(over?"Wochenauswertung":"Zwischenbilanz")+'</h2><span class="badge" style="background:'+col+'">'+label+'</span><p style="margin:0 0 8px">'+txt+'</p>';
 if(strong.length)h+='<b>Gut abgedeckt:</b><ul>'+strong.map(function(x){return "<li>"+x.ic+" "+x.n+"</li>"}).join("")+"</ul>";
 if(weak.length)h+='<b>Das kannst du verbessern:</b><ul>'+weak.map(function(x){return "<li>"+x.ic+" <b>"+x.n+"</b> ("+per[x.id]+" von "+elapsed+" Tagen): "+x.tip+"</li>"}).join("")+"</ul>";
 if(!weak.length)h+="<p>Nichts Auffälliges. Bleib einfach bei deiner Routine.</p>";
 return h+"</div>";
}

function renderWeek(){
 var h='<div class="nav"><button data-a="prev" aria-label="Vorherige Woche">‹</button><div style="text-align:center"><h1>Meine Woche</h1><div class="sub">'+fmt(ws)+" – "+fmt(addDays(ws,6))+'</div></div><button data-a="next" aria-label="Nächste Woche">›</button></div>';
 h+=banner();
 h+='<button class="day" data-a="food"><span style="font-size:26px">🔍</span><div class="info"><div class="name">Darf ich das essen?</div><div class="sub">Lebensmittel-Ampel für die Schwangerschaft</div></div><span>›</span></button>';
 h+='<button class="day" data-a="risk"><span style="font-size:26px">🗓️</span><div class="info"><div class="name">Wochen-Check</div><div class="sub">Risiken und Warnzeichen in deiner Woche</div></div><span>›</span></button>';
 for(var i=0;i<7;i++){var d=addDays(ws,i),k=iso(d),c=cnt(k),done=data[k]&&data[k].done;
  h+='<button class="day'+(k===todayKey?" today":"")+'" data-a="open" data-k="'+k+'"><div class="info"><div class="name">'+TAGE[i]+'</div><div class="sub">'+fmt(d)+" · "+c+" von "+NEEDS.length+' Bedarfen</div><div class="bar"><i style="width:'+(c/NEEDS.length*100)+'%"></i></div></div><span class="chk'+(done?" on":"")+'" role="button" aria-label="Tag abhaken" data-a="done" data-k="'+k+'">'+(done?"✓":"")+"</span></button>";}
 h+=evaluation();
 h+='<div class="note">Diese App ersetzt keine ärztliche oder hebammenärztliche Beratung. Die Daten bleiben nur auf diesem Gerät.</div>';
 app.innerHTML=h;
}

function renderDay(k){
 var d=parse(k),r=rec(k),i=(d.getDay()+6)%7;
 var h='<button class="back" data-a="back">‹ Zur Woche</button><h1>'+TAGE[i]+", "+fmt(d)+'</h1><div class="sub" style="margin-bottom:12px">Tippe auf einen Bedarf, sobald du ihn gedeckt hast.</div><div class="sub" style="background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px">Richtwerte für 162 cm und 52 kg (BMI ca. 20, Normalgewicht) nach D-A-CH-Empfehlungen. In der Frühschwangerschaft brauchst du kaum mehr Kalorien, es kommt auf die Qualität an.</div>';
 if(k===todayKey)h+=banner();
 NEEDS.forEach(function(x){var on=r.n[x.id];
  h+='<div class="need'+(on?" on":"")+'" data-a="need" data-k="'+k+'" data-id="'+x.id+'"><span class="ic">'+x.ic+'</span><div class="body"><div class="t">'+x.n+'</div><div class="why">'+x.why+'</div><div class="amt">🎯 '+x.amt+'</div><div class="chips">'+x.ex.map(function(e){return "<span>"+e+"</span>"}).join("")+'</div></div><span class="box">'+(on?"✓":"")+"</span></div>";});
 h+='<div class="sub" style="text-align:center">'+cnt(k)+" von "+NEEDS.length+" Bedarfen gedeckt</div>";
 app.innerHTML=h;window.scrollTo(0,0);
}

var FD=`Rohes Fleisch (Tatar, Mett, Carpaccio)|f|r|Toxoplasmose- und Salmonellengefahr
Rohwurst (Salami, Teewurst, Mettwurst, Cervelat)|f|r|Roh, daher Listerien- und Toxoplasmose-Risiko
Rohschinken (Parma, Serrano, Schwarzwälder)|f|r|Nur gut durcherhitzt essen, z. B. auf Pizza (ab 70 °C)
Fleisch, gut durchgegart (Huhn, Rind, Schwein)|f|g|Kerntemperatur mindestens 70 °C, innen nicht rosa
Aufschnitt, Kochschinken, Leberkäse (abgepackt)|f|y|Listerien möglich: frisch kaufen, zügig essen oder erhitzen
Pastete, Rillettes, Fleischaufstrich (Kühltheke)|f|y|Listerien möglich, besser meiden oder gut erhitzen
Dosenwurst, Konserven (sterilisiert)|f|g|Durch das Sterilisieren keimarm
Leber, Leberwurst, Lebertran|f|r|Sehr viel Vitamin A, das dem Baby schaden kann
Sushi mit rohem Fisch, Austern, rohe Meeresfrüchte|f|r|Listerien, Parasiten und Noroviren
Räucherlachs, Graved Lachs, Matjes|f|r|Kalt geräuchert oder roh gesalzen: Listerienrisiko
Heißgeräucherter Fisch (Forelle, Makrele)|f|y|Meist ok, wenn frisch gekauft und schnell gegessen
Fisch, gut durchgegart (Lachs, Kabeljau, Seelachs)|f|g|Liefert Jod und Omega-3, 1–2 Portionen pro Woche
Schwertfisch, Hai, Marlin, Königsmakrele|f|r|Hohe Quecksilberbelastung
Thunfisch (Dose oder frisch)|f|y|Quecksilber: nur gelegentlich, max. 1× pro Woche
Garnelen, Muscheln (durchgegart)|f|g|Nur komplett durchgegart essen
Eier, hartgekocht oder durchgebraten|e|g|Eigelb und Eiweiß müssen fest sein
Rohes oder weiches Ei (Frühstücksei, Tiramisu, selbstgemachte Mayonnaise)|e|r|Salmonellengefahr
Roher Teig (Kuchen, Kekse, Pizza)|e|r|Rohe Eier und Mehl können Keime enthalten
Milch, Joghurt, Quark (pasteurisiert)|e|g|Gute Quelle für Calcium und Jod
Rohmilch, Vorzugsmilch|e|r|Listerien- und Salmonellengefahr, nur abgekocht trinken
Hartkäse (Gouda, Emmentaler, Parmesan, Bergkäse)|e|g|Auch aus Rohmilch unbedenklich
Frischkäse, Mozzarella, Feta, Hüttenkäse (pasteurisiert)|e|g|Auf „pasteurisiert“ achten
Schmelzkäse, Kochkäse|e|g|Durch Erhitzen keimarm
Camembert, Brie, Gorgonzola (pasteurisiert)|e|y|Rinde abschneiden, durchgebacken unbedenklich
Weichkäse aus Rohmilch (Brie, Camembert, Münster, Roquefort)|e|r|Listerienrisiko
Softeis, Eis aus der Eisdiele|e|y|Listerien möglich, verpacktes Eis ist unproblematisch
Verpacktes Eis, Eis am Stiel|e|g|Unproblematisch, in Maßen wegen Zucker
Mayonnaise (Fertigprodukt)|e|g|Industriell aus pasteurisiertem Ei hergestellt
Obst und Gemüse, gründlich gewaschen|o|g|Waschen schützt vor Toxoplasmose
Ungewaschenes Obst, Gemüse, Salat aus dem Garten|o|r|Erdreste können Toxoplasmose-Erreger enthalten
Fertigsalate, Salat vom Buffet, geschnittenes Obst|o|y|Listerien möglich: frisch kaufen, nochmal waschen, schnell essen
Rohe Sprossen und Keimlinge (Alfalfa, Mungbohnen)|o|r|Keimrisiko, nur gut erhitzt essen
Tiefkühlbeeren (Himbeeren, Erdbeeren)|o|y|Vorher mindestens 2 Minuten kochen (Noroviren, Hepatitis A)
Trockenfrüchte (Datteln, Aprikosen, Feigen)|o|g|In Maßen, enthalten viel Zucker
Rohe grüne Bohnen|o|r|Enthalten Phasin, nur gekocht essen
Leitungs- und Mineralwasser|g|g|Ideal, 1,5–2 Liter täglich
Alkohol (Wein, Bier, Sekt, Spirituosen)|g|r|Es gibt keine sichere Menge, schadet dem Baby
Alkoholfreies Bier oder Wein|g|y|Kann bis zu 0,5 % Alkohol enthalten
Kaffee|g|y|Koffein max. 200 mg pro Tag, etwa 2–3 Tassen
Schwarzer und grüner Tee, Cola|g|y|Koffein mitrechnen (200 mg pro Tag)
Energydrinks|g|r|Viel Koffein, nicht empfohlen
Saft, pasteurisiert (als Schorle)|g|g|1 Teil Saft, 2–3 Teile Wasser
Frisch gepresster Saft, unpasteurisiert|g|y|Keime möglich, selbst gepresst sofort trinken
Fenchel-, Anis-, Kümmel-, Kamillentee|g|g|2–3 Tassen täglich
Salbei-, Beifuß-, Süßholz-, Johanniskrauttee|g|r|Können Wehen oder Blutdruck beeinflussen
Kombucha|g|y|Meist unpasteurisiert, enthält Spuren von Alkohol
Honig|s|g|Für Schwangere unbedenklich (nur für Babys unter 1 Jahr nicht)
Nüsse, Mandeln, Erdnüsse|s|g|Gut, außer bei bekannter Allergie
Schokolade|s|g|In Maßen, enthält etwas Koffein
Lakritz|s|y|Süßholz kann den Blutdruck erhöhen, nur kleine Mengen
Süßstoffe (Stevia, Aspartam)|s|y|In kleinen Mengen unbedenklich
Fertiggerichte, Fast Food|s|y|Viel Fett und Salz, gut durcherhitzt essen
Sushi ohne rohen Fisch (Gemüse, gegarter Fisch)|s|g|Ohne rohe Zutaten unbedenklich
Nahrungsergänzung mit Vitamin A|s|r|Hohe Dosen schaden dem Baby, vorher mit der Ärztin klären`.split('\n').map(function(l){var p=l.split('|');return{n:p[0],c:p[1],s:p[2],t:p[3]}});
var FC=[['a','Alle'],['f','Fleisch & Fisch'],['e','Eier & Milch'],['o','Obst & Gemüse'],['g','Getränke'],['s','Sonstiges']];
var SL={g:'Unbedenklich',y:'Mit Vorsicht',r:'Meiden'};
var fcat='a',fq='';
function foodItems(){
 var q=fq.toLowerCase().trim();
 var l=FD.filter(function(x){return (fcat==='a'||x.c===fcat)&&(!q||x.n.toLowerCase().indexOf(q)>-1||x.t.toLowerCase().indexOf(q)>-1)});
 if(!l.length)return '<div class="sub" style="text-align:center;padding:20px">Nichts gefunden. Frag im Zweifel Ärztin oder Hebamme.</div>';
 return l.map(function(x){return '<div class="fi '+x.s+'"><span class="dot"></span><div><div class="t">'+x.n+'</div><div class="lb">'+SL[x.s]+'</div><div class="why">'+x.t+'</div></div></div>'}).join('');
}
function renderFood(){
 var h='<button class="back" data-a="back">‹ Zur Woche</button><h1>Darf ich das essen?</h1><div class="sub" style="margin-bottom:12px">Ampel nach Empfehlungen von BfR und DGE. Keine Garantie: Im Zweifel Ärztin oder Hebamme fragen.</div><input id="fq" type="search" placeholder="Lebensmittel suchen …" value="'+fq.replace(/"/g,'&quot;')+'"><div style="margin-bottom:4px">';
 h+=FC.map(function(c){return '<button class="fc'+(c[0]===fcat?' on':'')+'" data-a="fcat" data-id="'+c[0]+'">'+c[1]+'</button>'}).join('')+'</div><div id="fl">'+foodItems()+'</div>';
 app.innerHTML=h;window.scrollTo(0,0);
}
app.addEventListener('input',function(e){if(e.target.id==='fq'){fq=e.target.value;document.getElementById('fl').innerHTML=foodItems()}});
var PH=[

function ul(a){return '<ul>'+a.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul>'}
function renderRisk(){
 var n=null,w=0,cur=0,h;
 if(sw.d){var d0=parse(sw.d);var lmp=sw.m==='et'?addDays(d0,-280):d0;n=Math.round((parse(todayKey)-lmp)/86400000)}
 var ok=n!==null&&n>=0&&n<=301;
 if(ok){w=Math.floor(n/7);PH.forEach(function(p,i){if(w>=p.a)cur=i})}
 var sel=rph===null?cur:rph,P=PH[sel];
 h='<button class="back" data-a="back">‹ Zur Woche</button><h1>Wochen-Check</h1><div class="sub" style="margin-bottom:12px">Orientierung, welche Themen in deiner Woche wichtig sind. Das ist keine Diagnose.</div>';
 h+=[['lmp','Erster Tag der letzten Periode'],['et','Errechneter Geburtstermin']].map(function(c){return '<button class="fc'+(c[0]===sw.m?' on':'')+'" data-a="rmode" data-id="'+c[0]+'">'+c[1]+'</button>'}).join('');
 h+='<input id="rdate" type="date" value="'+sw.d+'">';
 if(ok)h+='<div class="eval" style="margin-top:0;margin-bottom:12px"><b>Du bist in SSW '+w+'+'+(n%7)+'</b><div class="sub">vollendete Wochen + Tage</div></div>';
 else if(sw.d)h+='<div class="banner">Bitte prüfe das Datum.</div>';
 else h+='<div class="sub" style="margin-bottom:12px">Trage ein Datum ein, dann zeigt die App deine aktuelle Woche. Du kannst unten auch andere Phasen ansehen.</div>';
 h+=PH.map(function(p,i){return '<button class="fc'+(i===sel?' on':'')+'" data-a="rph" data-id="'+i+'">'+p.l+'</button>'}).join('');
 h+='<div class="eval"><h2>Typisch in dieser Phase</h2>'+ul(P.t)+'</div>';
 h+='<div class="eval"><h2>Mögliche Risiken</h2>'+ul(P.r)+'</div>';

 h+='<div class="eval"><h2>Termine und Untersuchungen</h2>'+ul(P.v)+'</div>';

 app.innerHTML=h;window.scrollTo(0,0);
}

function render(){view==="week"?renderWeek():view==="food"?renderFood():view==="risk"?renderRisk():renderDay(view)}

app.addEventListener("click",function(e){

 if(a==="prev"){ws=addDays(ws,-7)}
 else if(a==="next"){ws=addDays(ws,7)}
